apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-min
  labels:
    app: nginx-min
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-min
  template:
    metadata:
      labels:
        app: nginx-min
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"